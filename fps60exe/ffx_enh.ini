; settings v3
; ffx_enh.ini - the settings of FFX Enhanced that are not the games' own (those stay in GameSetting.ini): the 60 fps
; patch of FFX_enh.exe / FFX-2_enh.exe / dbghelp.dll (FFX-60fps by Peter Nguyen, Apache-2.0), the start options and
; the launcher's own settings. Before 2026-11-15 this file was FFX_60fps.ini (renamed by the launcher and the games).
; Read once when the game starts. The launcher's Framerate setting and the games' Esc menu (Video > Frame Rate) write fps.
; The defaults are the "optimized" setup of this build (tuned for SteamOS / Steam Deck); the options of the original mod
; are all here and can be switched back on.
[fps60]
; frames per second: 30 = the game's original timing, 60, 90, 120 ... 240 in steps of 30. Above 60 the PC must hold the
; rate. FFX-2: see docs (rates above 60 are new and less tested than FFX).
fps=60
; optimized = below 60 fps single frames are left out and the game keeps its speed (no fall to 30 fps); above 60 fps the
;             rate steps down to what the PC holds (PERF-002), to 60 at the lowest.
; original  = the mod's pacing: fixed passes per game tick; when the PC cannot hold the rate, PERF-002 steps down, at 60 to
;             the game's own 30 fps for 20 s and more.
pacing=optimized
; the Frame Rate row in the games' Esc menu (Video page); 0 = the menu as shipped
menu=1
; soft reset to the title screen: hold these buttons together; needs SR-003=1 / X2-SR-003=1 below
; buttons: L1 L2 R1 R2 L3 R3 START SELECT TRIANGLE CIRCLE CROSS SQUARE UP DOWN LEFT RIGHT, joined by +
soft_reset=L1+L2+R1+R2+START+SELECT
; keyboard keys of the mod: F7 = smoothing on / off, the fast-forward key below. 0 = no key is read (optimized)
hotkeys=0
; 1 = write FFX_enh.log / FFX-2_enh.log next to the game
log=1
; 1 = a frame rate line every 5 s and the patch's periodic reports in the log
verbose=0

[rows]
; ---- FINAL FANTASY X ----
; V-Sync by the patch: every frame waits for the screen refresh (no tearing). 0 = as the game presents (optimized: the
; game's own VSync setting of the launcher / Esc menu decides). With 1 the frame rate must not be above the screen's
; refresh rate (Steam Deck: 60 or 90), or the game runs slow.
VSYNC=0
; smooth camera and character motion between game ticks; 0 = off
SMOOTH=1
; step the frame rate down when the PC cannot hold it (see pacing above); 0 = off
PERF-002=1
; voiced cutscenes play at the original 30 fps so that voice and lips stay in sync; 0 = off
CLK-013=1
; soft reset (button chord above); 1 = on
SR-003=0
; hold a key to fast-forward (needs hotkeys=1); key = Windows virtual-key code (96 = numpad 0, 112 = F1); speed 2..30
DEV-TURBO=0
DEV-TURBO-KEY=96
DEV-TURBO-SPEED=10
; gameplay options of the mod (all off = the original game)
; every party member has the Sensor effect
QOL-SENSOR=0
; every party member earns AP after a battle, also those who did not fight
QOL-AP=0
; with QOL-AP: 1 = members KO'd at the end earn AP too
QOL-AP-KO=1
; with QOL-AP: AP for members who did not fight, in percent of a fighter's
QOL-AP-RATE=100
; after a party wipe, ask "Retry / Give up"
QOL-RETRY=0
; with QOL-RETRY: 1 = the soft-reset chord in battle shows the prompt too
QOL-RETRY-CHORD=1
; Fast Fury: Lulu's Fury ends at once and casts this many spells; 0 = off, 2..5
QOL-FURY=0
; Fast Battle Menu: battle command windows open and take input at once
QOL-BTLMENU=0
; no running-chocobo animation when the game autosaves
QOL-SAVEICON=0

; ---- FINAL FANTASY X-2 ----
; V-Sync by the patch (the game itself presents without waiting); 1 = on. Steam Deck: try 1
X2-VSYNC=0
; smooth camera and character motion between game ticks; 0 = off
X2-SMOOTH=1
; field main menu at 60 fps (other menus stay at the original 30 fps); 0 = off
X2-MENU-002=1
X2-MENU-002-TWEEN=1
X2-MENU-002-DRAWREPLAY=1
X2-MENU-002-POINT=1
X2-MENU-002-BACKDROP=1
; soft reset (button chord above); 1 = on
X2-SR-003=0
; hold a key to fast-forward (needs hotkeys=1)
X2-DEV-TURBO=0
X2-DEV-TURBO-KEY=96
X2-DEV-TURBO-SPEED=10

[start]
; 1 = skip the opening screen of both games: the logos (Square Enix, Virtuos, CRI, Dolby) and the autosave notice
skip_logos=0
; 1 = when a game is quit it does not start the launcher again
no_launcher_restart=0
; 1 = load ffgriever's External File Loader: modules\ff10-file-loader.dll in the game folder or in its EFL subfolder (with
; simpleLog.dll and hook.ini next to the modules folder). Unpacked game files are then read from data\mods. EFL's own
; dinput8.dll is not needed.
file_loader=0
; EXPERIMENTAL. 1 = ultrawide patch for both games (field of view, culling, menus, battle and map UI for the aspect ratio of
; the screen; the patch set of RevoFX's FFX module, from SUWSF). Only on screens wider than 16:9; choose the screen's
; resolution in the launcher. ultrawide_size=WxH uses that size instead of the primary screen's (empty = the screen).
ultrawide=0
ultrawide_size=

[launcher]
; menu graphics of the launcher: auto (by monitor height: below 1080 original, up to 1440 the 1440 set, above 2160), 1440,
; 2160, original
Resources=auto
; Proton compatibility mode: 1 = FFX.exe / FFX-2.exe are the 60 fps builds (originals in backup_original); set by the launcher
ProtonCompat=0
